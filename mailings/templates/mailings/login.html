{% extends 'mailings/base.html' %}

{% block title %}Вход в систему — Mailing CRM{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4" style="color: var(--color-teal);">Вход в систему</h2>
                
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Имя пользователя или Email</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus style="font-family: Montserrat, sans-serif;">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">Пароль</label>
                        <input type="password" name="password" id="id_password" class="form-control" required style="font-family: Montserrat, sans-serif;">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Войти</button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-1"><a href="{% url 'password_reset' %}" class="text-decoration-none" style="color: var(--color-teal);">Забыли пароль?</a></p>
                    <p class="mb-0">Нет аккаунта? <a href="{% url 'register' %}" class="fw-bold" style="color: var(--color-teal-dark);">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
