{% extends 'mailings/base.html' %}

{% block title %}Сброс пароля — Mailing CRM{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4" style="color: var(--color-teal);">Сброс пароля</h2>
                <p class="text-muted text-center mb-4">Введите ваш email, и мы отправим вам инструкцию по восстановлению пароля.</p>
                
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" id="id_email" class="form-control" required autofocus style="font-family: Montserrat, sans-serif;">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Отправить инструкцию</button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="text-decoration-none" style="color: var(--color-teal);">← Вернуться ко входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
