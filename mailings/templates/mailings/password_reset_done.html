{% extends 'mailings/base.html' %}

{% block title %}Письмо отправлено — Mailing CRM{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <h2 class="fw-bold mb-4" style="color: var(--color-teal);">Письмо отправлено!</h2>
                <p class="text-muted mb-4">Мы отправили вам инструкцию по сбросу пароля на указанный email. Проверьте папку "Входящие" или "Спам".</p>
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Вернуться ко входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
