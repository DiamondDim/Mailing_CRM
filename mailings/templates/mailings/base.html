{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mailing CRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-graphite: #1e293b;
            --color-graphite-dark: #0f172a;
            --color-teal: #14b8a6;
            --color-teal-dark: #0d9488;
            --color-teal-light: #f0fdfa;
            --color-blue: #3b82f6;
            --color-purple: #a855f7;
            --color-bg: #f8fafc;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-graphite);
        }
        
        .navbar {
            background-color: var(--color-graphite-dark) !important;
            padding: 1rem 0;
        }
        
        .navbar-brand {
            color: var(--color-teal) !important;
            font-weight: 700;
            font-size: 1.3rem;
        }
        
        .nav-link {
            color: #cbd5e1 !important;
            transition: color 0.2s;
        }
        
        .nav-link:hover {
            color: var(--color-teal) !important;
        }
        
        .btn-primary {
            background-color: var(--color-teal);
            border-color: var(--color-teal);
        }
        
        .btn-primary:hover {
            background-color: var(--color-teal-dark);
            border-color: var(--color-teal-dark);
        }
        
        .btn-outline-primary {
            color: var(--color-teal);
            border-color: var(--color-teal);
        }
        
        .btn-outline-primary:hover {
            background-color: var(--color-teal);
            border-color: var(--color-teal);
        }
        
        .btn-success {
            background-color: var(--color-teal-dark);
            border-color: var(--color-teal-dark);
        }
        
        .table-dark {
            background-color: var(--color-graphite);
        }
        
        .card-stat {
            border: none;
            border-radius: 12px;
            color: white;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .card-stat .stat-title {
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.95;
            margin-bottom: 0.5rem;
        }
        
        .card-stat .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
        }
        
        .bg-teal { background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); }
        .bg-blue { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .bg-purple { background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%); }
        
        .badge-status-started { background-color: var(--color-teal); }
        .badge-status-created { background-color: #f59e0b; }
        .badge-status-completed { background-color: #64748b; }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Mailing CRM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'client_list' %}">Клиенты</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'message_list' %}">Сообщения</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'mailing_list' %}">Рассылки</a></li>
                    {% if user.is_authenticated %}
                        <li class="nav-item"><span class="nav-link text-muted">({{ user.username }})</span></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
