{% extends 'mailings/base.html' %}

{% block title %}Удаление клиента — Mailing CRM{% endblock %}

{% block content %}
<div class="alert alert-danger">
    <h4 class="alert-heading">Подтверждение удаления</h4>
    <p>Вы действительно хотите удалить клиента <strong>{{ object.full_name }}</strong>?</p>
    <hr>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'client_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
