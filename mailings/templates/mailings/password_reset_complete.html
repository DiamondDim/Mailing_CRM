{% extends 'mailings/base.html' %}

{% block title %}Пароль изменён — Mailing CRM{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <h2 class="fw-bold mb-4" style="color: var(--color-teal);">Пароль успешно изменён!</h2>
                <p class="text-muted mb-4">Теперь вы можете войти в систему, используя новый пароль.</p>
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Войти в систему</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
